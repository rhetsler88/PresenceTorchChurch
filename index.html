<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Presence Torch Church" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Push-to-talk communication designed for church safety teams. Coordinate channels, monitor transmissions, and manage organization-wide protection levels."
    />
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <title>Presence Torch Church</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: hsl(222, 47%, 6%);
        color: hsl(210, 40%, 96%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #root {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }

      .app-loading__spinner {
        width: 2rem;
        height: 2rem;
        border: 4px solid hsl(38 92% 50% / 0.2);
        border-top-color: hsl(38, 92%, 50%);
        border-radius: 50%;
        animation: app-loading-spin 0.8s linear infinite;
      }

      .app-loading__label {
        font-size: 0.875rem;
        font-weight: 500;
        color: hsl(220, 9%, 56%);
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-live="polite" aria-label="Connecting">
        <div class="app-loading__spinner" aria-hidden="true"></div>
        <span class="app-loading__label">Connecting...</span>
      </div>
      <h1 class="sr-only">Presence Torch Church</h1>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
